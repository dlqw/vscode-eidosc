name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Eidos release SemVer (Marketplace uses its numeric mapping)
        required: true
        type: string
      publish_marketplace:
        description: Publish through VSCE_PAT instead of the manual Marketplace upload flow
        required: true
        default: false
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Verify and package
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node test/release-fast-lane.js "$GITHUB_SHA" | tee release-proof.json
          declared="$(node -p "require('./compatibility.json').version")"
          test "$declared" = "${{ inputs.version }}"
          marketplace="$(node -p "require('./package.json').version")"
          test "$marketplace" = "0.9.0"
          test -f "changelogs/${{ inputs.version }}.md"
          npm test
          npx --yes @vscode/vsce package --pre-release --changelog-path "changelogs/${{ inputs.version }}.md" -o "eidos-language-${{ inputs.version }}.vsix"
      - name: Verify Marketplace publisher access
        if: ${{ inputs.publish_marketplace }}
        env:
          VSCE_PAT: "${{ secrets.VSCE_PAT }}"
        run: |
          set -euo pipefail
          test -n "$VSCE_PAT"
          publisher="$(node -p "require('./package.json').publisher")"
          npx --yes @vscode/vsce verify-pat "$publisher"
      - name: Publish Marketplace prerelease
        if: ${{ inputs.publish_marketplace }}
        env:
          VSCE_PAT: "${{ secrets.VSCE_PAT }}"
        run: npx --yes @vscode/vsce publish --pre-release --packagePath "eidos-language-${{ inputs.version }}.vsix"
      - name: Publish GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "v${{ inputs.version }}" "eidos-language-${{ inputs.version }}.vsix" --target "$GITHUB_SHA" --prerelease --title "v${{ inputs.version }}" --notes-file "changelogs/${{ inputs.version }}.md"
